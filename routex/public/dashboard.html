<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RouteX Dashboard</title>
<style>
  :root{--bg:#0b0f1a;--card:#141b2e;--line:#243049;--txt:#e7ecf5;--mut:#8ea0c0;--acc:#6d5efc;--ok:#31f889;--bad:#ff5c7a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2murky,transparent),var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
  .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#22d3ee);box-shadow:0 0 18px var(--acc)}
  .badge{font-size:12px;color:var(--mut)}
  main{max-width:1000px;margin:0 auto;padding:28px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:14px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
  .up{color:var(--ok)} .down{color:var(--bad)}
  .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  footer{max-width:1000px;margin:10px auto 40px;padding:0 28px;color:var(--mut);font-size:13px;display:flex;align-items:center;gap:10px}
  footer a{color:var(--txt);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  footer a:hover{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span> RouteX</div>
  <div class="badge" id="meta">loading…</div>
</header>
<main>
  <h2>Providers &amp; Health</h2>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <span>Built by <b>Rikshit Joshi</b></span>
  <a href="https://instagram.com/whoisrikshit" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
    @whoisrikshit
  </a>
</footer>
<script>
async function tick(){
  try{
    const r = await fetch('/api/status'); const d = await r.json();
    document.getElementById('meta').textContent = 'v'+d.version+' · strategy: '+d.strategy+' · '+d.providers.length+' providers';
    const g = document.getElementById('grid'); g.innerHTML='';
    d.providers.forEach(p=>{
      const el = document.createElement('div'); el.className='card';
      el.innerHTML = `<div class="name"><span class="dot"></span>${p.name}</div>
        <div class="row"><span>Status</span><span class="${p.healthy?'up':'down'}">${p.healthy?'● healthy':'● cooling'}</span></div>
        <div class="row"><span>Tier</span><span class="pill">${p.tier}</span></div>
        <div class="row"><span>Priority</span><span>${p.priority}</span></div>
        <div class="row"><span>Requests</span><span>${p.requests}</span></div>
        <div class="row"><span>Tokens</span><span>${p.tokens}</span></div>
        <div class="row"><span>Failures</span><span>${p.failures}</span></div>`;
      g.appendChild(el);
    });
  }catch(e){ document.getElementById('meta').textContent='offline'; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
